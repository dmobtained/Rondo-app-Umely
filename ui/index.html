<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DorisView Chart UI</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/vendor/lightweight-charts.js"></script>
  </head>
  <body>
    <header class="topbar">
      <h1>DorisView Setup Visualizer</h1>
      <p class="muted">See chart drawings + exact MT5 order values</p>
    </header>

    <section id="verdict-card" class="card verdict-card verdict-wait">
      <div class="verdict-header">
        <h2 id="verdict-action">ACTIE: WACHTEN</h2>
        <button id="copy-order" type="button">COPY MT5 ORDER</button>
      </div>
      <div id="verdict-grid" class="verdict-grid"></div>
      <p id="verdict-instruction" class="verdict-instruction">
        Voer deze waarden in bij MT5 en plaats de order.
      </p>
      <div id="verdict-countdown" class="muted"></div>
    </section>

    <main class="layout">
      <section class="card chart-card">
        <div class="chart-toolbar">
          <label for="mode-select">Mode:</label>
          <select id="mode-select">
            <option value="demo">Demo</option>
            <option value="live">Live</option>
            <option value="mt5_csv">MT5 CSV</option>
          </select>
          <label for="symbol-input">Symbol:</label>
          <input id="symbol-input" type="text" value="XAU/USD" />
          <button id="refresh-live" type="button">Refresh now</button>
          <label for="mt5-file-input">CSV file:</label>
          <input id="mt5-file-input" type="file" accept=".csv,.txt,text/csv,text/plain" />
          <label for="mt5-timeframe">CSV TF:</label>
          <select id="mt5-timeframe">
            <option value="1m">M1</option>
            <option value="5m">M5</option>
            <option value="15m">M15</option>
            <option value="1h">H1</option>
          </select>
          <button id="analyze-mt5" type="button">Analyse CSV</button>
          <label for="setup-select">Setup:</label>
          <select id="setup-select"></select>
          <span id="live-status" class="muted"></span>
          <span id="summary" class="muted"></span>
        </div>
        <div id="chart"></div>
      </section>

      <aside class="card side-panel">
        <h2>MT5 Input Values</h2>
        <div id="setup-meta" class="meta-grid"></div>

        <h3>Risk to lot calculator</h3>
        <div class="form-grid">
          <label>Account ($)</label>
          <input id="account-size" type="number" step="0.01" />

          <label>Risk %</label>
          <input id="risk-pct" type="number" step="0.01" />

          <label>$ per $1 move per 1.00 lot</label>
          <input id="point-value" type="number" step="0.01" value="100" />
        </div>
        <button id="recalc">Recalculate</button>
        <div id="lot-result" class="pill"></div>

        <h3>Why this setup</h3>
        <ul id="reasons"></ul>
      </aside>
    </main>

    <section class="card metrics">
      <h2>Backtest snapshot</h2>
      <pre id="metrics"></pre>
    </section>

    <script src="/app.js"></script>
  </body>
</html>
